# Google Meet
[[on-window-detected]]
if.app-id = 'com.brave.Browser.app.kjgfgldnnfoeklkmfkjfagphfepbbdan'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'move-node-to-workspace 6'

# Google Calendar
[[on-window-detected]]
if.app-id = 'com.brave.Browser.app.kjbdgfilnfhdoflbpgamdcdgpehopbep'
run = 'move-node-to-workspace 6'

# Gmail
[[on-window-detected]]
